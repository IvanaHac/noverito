<nav
  class="relative bg-white border-b border-neutral-200/50"
  (document:keydown.escape)="closeAll()"
>
  <div class="mx-auto max-w-screen-2xl px-6 lg:px-10">
    <div class="flex h-16 items-center justify-between gap-6">

      <!-- LEFT: logo -->
      <a href="#" class="flex items-center gap-4">
        <img
          src="assets/noverito.png"
          alt="Noverito"
          class="h-48 w-auto md:h-48"
        />
      </a>

      <!-- DESKTOP LINKS -->
      <div class="hidden md:flex items-center gap-6">

        <!-- ACTIVE (příklad: O nás) -->
        <a
          href="#"
          class="relative text-[13px] font-extrabold uppercase tracking-[0.18em] text-neutral-900
                 after:absolute after:left-0 after:-bottom-2 after:h-[2px] after:w-full after:bg-[#7C1D2D]"
        >
          O nás
        </a>

        <!-- ostatní: hover underline -->
        <a
          href="#"
          class="relative text-[13px] font-extrabold uppercase tracking-[0.18em] text-neutral-900
                 hover:text-neutral-700 transition
                 after:absolute after:left-0 after:-bottom-2 after:h-[2px] after:w-0 after:bg-[#7C1D2D]
                 after:transition-all after:duration-200 hover:after:w-full"
        >
          Služby
        </a>

        <a
          href="#"
          class="relative text-[13px] font-extrabold uppercase tracking-[0.18em] text-neutral-900
                 hover:text-neutral-700 transition
                 after:absolute after:left-0 after:-bottom-2 after:h-[2px] after:w-0 after:bg-[#7C1D2D]
                 after:transition-all after:duration-200 hover:after:w-full"
        >
          Realizace
        </a>

        <a
          href="#"
          class="relative text-[13px] font-extrabold uppercase tracking-[0.18em] text-neutral-900
                 hover:text-neutral-700 transition
                 after:absolute after:left-0 after:-bottom-2 after:h-[2px] after:w-0 after:bg-[#7C1D2D]
                 after:transition-all after:duration-200 hover:after:w-full"
        >
          Kontakt
        </a>

        <a
          href="#"
          class="relative text-[13px] font-extrabold uppercase tracking-[0.18em] text-neutral-900
                 hover:text-neutral-700 transition
                 after:absolute after:left-0 after:-bottom-2 after:h-[2px] after:w-0 after:bg-[#7C1D2D]
                 after:transition-all after:duration-200 hover:after:w-full"
        >
          E-shop
        </a>

        <!-- CTA -->
        <a
  href="#poptavka"
  class="ml-2 inline-flex items-center gap-2
         rounded-full px-5 py-2
         text-[12px] font-semibold uppercase tracking-[0.14em]
         text-[#111827]
         bg-white
         border border-[#111827]/15
         hover:border-[#7C1D2D]/60
         hover:text-[#7C1D2D]
         transition-all duration-300
         shadow-[0_6px_18px_rgba(0,0,0,0.08)]"
>
  <span>Nezávazná poptávka</span>
  <span class="h-1.5 w-1.5 rounded-full bg-[#7C1D2D]
               opacity-70"></span>
</a>

      </div>
  
          
      <!-- Mobile toggle -->
      <div class="md:hidden">
        <button
          type="button"
          (click)="toggleMobile()"
          class="inline-flex items-center justify-center rounded-xl p-2 text-neutral-700 hover:bg-neutral-100 transition"
          [attr.aria-expanded]="mobileOpen"
          aria-controls="mobile-menu"
          aria-label="Otevřít menu"
        >
          <svg
            *ngIf="!mobileOpen"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
            class="h-6 w-6"
          >
            <path
              d="M4 6h16M4 12h16M4 18h16"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <svg
            *ngIf="mobileOpen"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
            class="h-6 w-6"
          >
            <path
              d="M6 6l12 12M18 6l-12 12"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="md:hidden" *ngIf="mobileOpen">
    <div class="mx-auto max-w-screen-2xl px-6 lg:px-10 pb-5">
      <div class="mt-2 rounded-2xl border border-neutral-200 bg-white shadow-sm overflow-hidden">
        <a
          href="#"
          class="flex items-center justify-between px-4 py-3 text-[13px] font-semibold text-neutral-900 hover:bg-neutral-50"
          (click)="mobileOpen = false"
        >
          O nás <span class="text-neutral-300">›</span>
        </a>
        <a
          href="#"
          class="flex items-center justify-between px-4 py-3 text-[13px] font-semibold text-neutral-900 hover:bg-neutral-50"
          (click)="mobileOpen = false"
        >
          Služby <span class="text-neutral-300">›</span>
        </a>
        <a
          href="#"
          class="flex items-center justify-between px-4 py-3 text-[13px] font-semibold text-neutral-900 hover:bg-neutral-50"
          (click)="mobileOpen = false"
        >
          Realizace <span class="text-neutral-300">›</span>
        </a>
        <a
          href="#"
          class="flex items-center justify-between px-4 py-3 text-[13px] font-semibold text-neutral-900 hover:bg-neutral-50"
          (click)="mobileOpen = false"
        >
          Kontakt <span class="text-neutral-300">›</span>
        </a>
        <a
          href="#"
          class="flex items-center justify-between px-4 py-3 text-[13px] font-semibold text-neutral-900 hover:bg-neutral-50"
          (click)="mobileOpen = false"
        >
          E-shop <span class="text-neutral-300">›</span>
        </a>

        <div class="p-3 border-t border-neutral-200">
          <a
            href="#poptavka"
            class="flex w-full items-center justify-center rounded-full px-4 py-3 text-[13px] font-semibold
                   bg-[#7C1D2D] text-white shadow-sm shadow-black/10 ring-1 ring-black/5"
            (click)="mobileOpen = false"
          >
            Nezávazná poptávka
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>
