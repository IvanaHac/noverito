<section
  id="realizace"
  class="bg-white border-b border-neutral-200 scroll-mt-72 md:scroll-mt-80"
>
  <!-- HLAVNÍ NADPIS -->
  <div class="mx-auto max-w-6xl px-6 pt-16 sm:pt-20 pb-10">
    <div class="mb-8">
      <h2 class="text-4xl font-extrabold tracking-tight text-neutral-950 md:text-5xl">
        Ukázky realizací
      </h2>

      <div class="mt-5 flex items-center gap-3">
        <span class="h-[2px] w-10 rounded-full bg-[#7C1D2D]"></span>
        <span class="h-px w-24 bg-neutral-200"></span>
      </div>
    </div>
  </div>

  <!-- 3 ZAKÁZKY VEDLE SEBE -->
  <div class="mx-auto max-w-7xl px-4 sm:px-6 pb-20">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

      <div
        *ngFor="let reference of references; let i = index"
        class="group cursor-pointer"
        (click)="openLightbox(reference.images, 0)"
      >
        <figure class="overflow-hidden rounded-2xl bg-neutral-100">
          <img
            [src]="reference.images[0]"
            alt=""
            class="w-full h-[320px] md:h-[420px] object-cover
                   transition duration-500 group-hover:scale-105"
            loading="lazy"
          />
        </figure>

        <h3 class="mt-4 text-lg font-extrabold tracking-tight text-neutral-900">
          {{ reference.subtitle }}
        </h3>
      </div>

    </div>
  </div>

  <!-- LIGHTBOX -->
  <div
    *ngIf="isLightboxOpen"
    class="fixed inset-0 z-[999] flex items-center justify-center"
    role="dialog"
    aria-modal="true"
  >
    <!-- BACKDROP -->
    <div
      class="absolute inset-0 bg-black/75"
      (click)="closeLightbox()"
    ></div>

    <!-- CLOSE -->
    <button
      type="button"
      class="lb-close"
      (click)="closeLightbox(); $event.stopPropagation()"
    >
      ✕
    </button>

    <!-- CONTENT -->
    <div
      class="relative z-[1000] w-[min(1280px,94vw)] px-3 sm:px-6"
      (click)="$event.stopPropagation()"
    >
      <div class="relative flex items-center justify-center">
        <img
          [src]="activeImages[activeIndex]"
          class="lb-image"
        />

        <!-- PREV -->
        <button
          type="button"
          class="lb-nav left-2 sm:left-4"
          (click)="prev(); $event.stopPropagation()"
        >
          ‹
        </button>

        <!-- NEXT -->
        <button
          type="button"
          class="lb-nav right-2 sm:right-4"
          (click)="next(); $event.stopPropagation()"
        >
          ›
        </button>

        <!-- COUNTER -->
        <div class="lb-counter">
          {{ activeIndex + 1 }} / {{ activeImages.length }}
        </div>
      </div>
    </div>
  </div>

</section>
