<section id="kontakt" class="bg-white scroll-mt-48 md:scroll-mt-64">
  <div class="mx-auto max-w-6xl px-6 sm:px-8 lg:px-10 py-14 md:py-18">

    <!-- HEADING -->
    <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
      <div class="max-w-3xl">


        <h2 class="mt-3 text-3xl md:text-5xl font-extrabold tracking-tight text-neutral-900">
          Kontakt
        </h2>
      </div>

      <div class="hidden md:flex items-center gap-3 text-[11px] font-semibold tracking-[0.30em] uppercase text-neutral-500">
        <span class="h-px w-10 bg-neutral-300"></span>
        <span>Telefon • E-mail</span>
      </div>
    </div>

    <!-- CARDS -->
    <div class="mt-10 grid grid-cols-1 gap-6 lg:grid-cols-2">

      <!-- PHONE -->
      <a
        class="group relative rounded-2xl bg-white p-7 md:p-8
               ring-1 ring-black/5
               shadow-[0_12px_30px_rgba(17,24,39,0.06)]"
        [href]="'tel:' + phoneLink"
      >
        <div class="absolute inset-x-0 top-0 h-[3px] rounded-t-2xl bg-neutral-200"></div>

        <div class="flex items-center gap-4">
          <div
            class="grid h-11 w-11 place-items-center rounded-xl
                   bg-[#7C1D2D]/10 ring-1 ring-[#7C1D2D]/30"
            aria-hidden="true"
          >
            <svg class="h-5 w-5 text-[#7C1D2D]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M5 4h4l2 5-2 1c1.5 3 4 5.5 7 7l1-2 5 2v4c0 1-1 2-2 2-9.4 0-17-7.6-17-17 0-1 1-2 2-2z" />
            </svg>
          </div>

          <div>
            <div class="mt-1 inline-flex items-center gap-2 text-2xl font-extrabold tracking-tight text-neutral-900">
              {{ phoneDisplay }}
              <svg class="h-4 w-4 text-neutral-400 group-hover:text-neutral-500 transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/>
              </svg>
            </div>
          </div>
        </div>
      </a>

      <!-- EMAIL -->
      <a
        class="group relative rounded-2xl bg-white p-7 md:p-8
               ring-1 ring-black/5
               shadow-[0_12px_30px_rgba(17,24,39,0.06)]"
        [href]="'mailto:' + emailLink"
      >
        <div class="absolute inset-x-0 top-0 h-[3px] rounded-t-2xl bg-neutral-200"></div>

        <div class="flex items-center gap-4">
          <div
            class="grid h-11 w-11 place-items-center rounded-xl
                   bg-[#7C1D2D]/10 ring-1 ring-[#7C1D2D]/30"
            aria-hidden="true"
          >
            <svg class="h-5 w-5 text-[#7C1D2D]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M4 7h16v10H4V7zM4 7l8 6 8-6" />
            </svg>
          </div>

          <div class="min-w-0">
            <div class="mt-1 inline-flex items-center gap-2 text-xl md:text-2xl font-extrabold tracking-tight text-neutral-900 break-all">
              {{ emailDisplay }}
              <svg class="h-4 w-4 text-neutral-400 group-hover:text-neutral-500 transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/>
              </svg>
            </div>
          </div>
        </div>
      </a>

    </div>
  </div>
</section>
