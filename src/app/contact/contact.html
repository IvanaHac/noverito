<!-- inquiry-form.component.html -->
<section id="kontakt" class="relative w-full overflow-hidden text-white">

  <!-- BACKGROUND IMAGE (handshake) -->
  <img
    src="assets/inquiry.png"
    alt="Uzavření spolupráce – podání ruky"
    class="absolute inset-0 h-full w-full object-cover"
    loading="lazy"
  />

  <div class="absolute inset-0 bg-gradient-to-br
            from-[#040814]/95
            via-[#071026]/85
            to-[#0A1838]/60">
</div>


  <!-- subtle focus vignette -->
  <div class="pointer-events-none absolute inset-0
              [background:radial-gradient(80%_60%_at_25%_30%,rgba(255,255,255,0.12),transparent_58%)]">
  </div>

  <!-- soft ornaments -->
  <div class="pointer-events-none absolute inset-0">
    <div class="absolute -top-28 -left-28 h-80 w-80 rounded-full bg-white/10 blur-3xl"></div>
    <div class="absolute -bottom-28 -right-28 h-80 w-80 rounded-full bg-white/8 blur-3xl"></div>
  </div>

<!-- CONTENT -->
<div class="relative mx-auto max-w-5xl px-6 sm:px-8 lg:px-10
            py-10 lg:py-16
            min-h-[6vh] lg:min-h-[55vh]
            flex items-center">

  <div class="grid w-full grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-12 items-start">


    <!-- LEFT -->
    <div class="lg:col-span-6 flex flex-col">
      <h2 class="mt-1 font-extrabold tracking-tight text-white
                 text-[40px] sm:text-[50px] lg:text-[56px]
                 leading-[1.02] max-w-[14ch]">
        Máte zájem<br>
        o nezávaznou nabídku?
      </h2>

      <p class="mt-4 text-[15px] sm:text-[16px] leading-7 text-white/75 max-w-xl">
        Ozvěte se nám telefonicky nebo e-mailem. Rádi s vámi probereme vaše požadavky a navrhneme vhodné řešení.
      </p>

      <div class="mt-7 h-px w-28 bg-white/25"></div>
    </div>

    <!-- RIGHT -->
    <div class="lg:col-span-6 flex flex-col gap-4 pt-2">

      <!-- PHONE -->
      <a
        class="group flex items-center justify-between gap-4
               rounded-2xl px-6 py-4
               bg-white/10 backdrop-blur
               ring-1 ring-white/15
               hover:bg-white/15 transition"
        [href]="'tel:' + phoneLink"
      >
        <div class="flex items-center gap-4 min-w-0">
          <div class="grid h-11 w-11 place-items-center rounded-xl
                      bg-white/10 ring-1 ring-white/25">
            <svg class="h-5 w-5 text-white"
                 viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.9">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M5 4h4l2 5-2 1c1.5 3 4 5.5 7 7l1-2 5 2v4c0 1-1 2-2 2-9.4 0-17-7.6-17-17 0-1 1-2 2-2z" />
            </svg>
          </div>

          <div class="min-w-0">
            <div class="text-[11px] tracking-[0.28em] uppercase text-white/60">
              Telefon
            </div>
            <div class="mt-1 text-[24px] font-semibold text-white">
              {{ phoneDisplay }}
            </div>
          </div>
        </div>

        <svg class="h-4 w-4 text-white/50 group-hover:text-white/70 transition"
             viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 18l6-6-6-6"/>
        </svg>
      </a>

      <!-- EMAIL -->
      <a
        class="group flex items-center justify-between gap-4
               rounded-2xl px-6 py-4
               bg-white/10 backdrop-blur
               ring-1 ring-white/15
               hover:bg-white/15 transition"
        [href]="'mailto:' + emailLink"
      >
        <div class="flex items-center gap-4 min-w-0">
          <div class="grid h-11 w-11 place-items-center rounded-xl
                      bg-white/10 ring-1 ring-white/25">
            <svg class="h-5 w-5 text-white"
                 viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.9">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M4 7h16v10H4V7zM4 7l8 6 8-6" />
            </svg>
          </div>

          <div class="min-w-0">
            <div class="text-[11px] tracking-[0.28em] uppercase text-white/60">
              E-mail
            </div>
            <div class="mt-1 text-[24px] font-semibold text-white break-all">
              {{ emailDisplay }}
            </div>
          </div>
        </div>

        <svg class="h-4 w-4 text-white/50 group-hover:text-white/70 transition"
             viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 18l6-6-6-6"/>
        </svg>
      </a>

    </div>

  </div>
</div>
