<!-- TOP BAR (match HERO) -->
<div class="w-full text-[#E5E7EB] border-b border-white/10
            bg-gradient-to-b from-[#111827] via-[#0f172a] to-[#0b1220]
            supports-[backdrop-filter]:bg-[#0f172a]/70 backdrop-blur">

  <!-- subtle burgundy hairline (premium accent) -->
  <div class="h-px w-full bg-gradient-to-r from-transparent via-[#7C1D2D]/70 to-transparent"></div>

  <div class="mx-auto max-w-screen-2xl px-6 lg:px-10">
    <div class="flex h-11 items-center justify-between text-[13px]">

      <!-- LEFT: oblast působení -->
      <div class="hidden md:flex items-center gap-3 min-w-0">
        <span class="relative inline-flex h-2 w-2 rounded-full bg-[#7C1D2D]">
          <span class="absolute inset-0 rounded-full bg-[#7C1D2D]/40 blur-[2px]"></span>
        </span>

        <span class="truncate text-white/75 tracking-wide">
          {{ areaText }}
        </span>
      </div>

      <!-- RIGHT: telefon -->
      <div class="flex items-center gap-3">
        <a
          class="inline-flex items-center gap-2 rounded-full px-5 py-3
                 text-white/85 hover:text-white transition
                 bg-white/0 hover:bg-white/5
                 border border-white/0 hover:border-white/10"
          [href]="'tel:' + phone.replaceAll(' ', '')"
          aria-label="Zavolat"
        >
          <svg class="h-4 w-4 text-[#7C1D2D]" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M2.5 5.5c0-1.1.9-2 2-2h3c.8 0 1.5.5 1.8 1.2l1 2.3c.3.7.1 1.5-.5 2l-1.5 1.2a15.5 15.5 0 0 0 6.7 6.7l1.2-1.5c.5-.6 1.3-.8 2-.5l2.3 1c.7.3 1.2 1 1.2 1.8v3c0 1.1-.9 2-2 2h-.7C10.6 23 2.5 14.9 2.5 5.5Z"/>
          </svg>

          <span class="font-semibold tracking-wide">
            {{ phone }}
          </span>
        </a>
      </div>

    </div>
  </div>
</div>
