<section class="relative w-full
                min-h-[78vh]
                sm:min-h-[72vh]
                lg:min-h-[65vh]
                overflow-hidden text-white">


  <!-- BACKGROUND IMAGE -->
  <img
    src="assets/hero-picture.png"
    alt="Sádrokartonový podhled se světly"
    class="absolute inset-0 h-full w-full object-cover"
    loading="eager"
  />

  <!-- DARK GRADIENT OVERLAY – BEZE ZMĚNY -->
  <div class="absolute inset-0 bg-gradient-to-br
              from-[#0B1224]/95
              via-[#0B1224]/85
              to-[#0B1224]/60">
  </div>

  <div class="relative mx-auto max-w-6xl px-6 py-20 lg:py-28">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">

      <!-- LEFT -->
      <div class="lg:col-span-6 relative z-10">

        <div class="mb-4 text-[14px] font-semibold tracking-[0.35em] uppercase text-neutral-300">
          Praha &amp; Středočeský kraj
        </div>

        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-bold uppercase tracking-[-0.01em]">
          <span class="block">Profesionální</span>
          <span class="block mt-2">sádrokartonové</span>
          <span class="block mt-2">řešení</span>
        </h1>

        <p class="mt-8 max-w-xl text-[16px] leading-8 text-white/75">
          Profesionální realizace sádrokartonových konstrukcí
          pro rodinné domy, byty i komerční prostory.
        </p>

        <div class="mt-10 flex flex-col sm:flex-row gap-3">
          <a
            href="#kontakt"
            class="group inline-flex items-center justify-center gap-3
                   rounded-full px-9 py-3 min-h-[48px]
                   text-[13px] font-semibold uppercase tracking-[0.18em]
                   bg-white text-[#0B1224]
                   hover:bg-white/90
                   transition-all duration-300
                   shadow-[0_22px_60px_rgba(0,0,0,0.55)]
                   ring-1 ring-white/10">
            <span>Nezávazná poptávka</span>
            <span class="h-1.5 w-1.5 rounded-full bg-[#7C1D2D]"></span>
          </a>

          <a
            href="#realizace"
            (click)="scrollToSection($event, 'realizace')"
            class="group inline-flex items-center justify-center gap-2
                   rounded-full px-9 py-3 min-h-[48px]
                   text-[13px] font-semibold uppercase tracking-[0.18em]
                   text-white/90 bg-white/5 backdrop-blur
                   border border-white/18
                   hover:bg-white/8 hover:border-white/28
                   transition-all duration-300">
            <span>Zobrazit realizace</span>
            <span class="translate-x-0 group-hover:translate-x-0.5 transition-transform duration-300">→</span>
          </a>
        </div>

      </div>
    </div>
  </div>
</section>
