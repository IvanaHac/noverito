<!-- HERO SECTION -->
<section class="relative w-full overflow-hidden bg-[#111827] text-white">

  <!-- DIAGONAL DOUBLE LINES (accent only) -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <!-- thin line -->
    <div
      class="absolute top-[-15%] left-[54%] sm:left-[56%] lg:left-[58%]
             h-[140%] w-[10px]
             -rotate-[20deg]
             bg-[#7C1D2D]/60">
    </div>

    <!-- thick line -->
    <div
      class="absolute top-[-15%] left-[56%] sm:left-[58%] lg:left-[60%]
             h-[140%] w-[22px]
             -rotate-[20deg]
             bg-[#7C1D2D]/85
             shadow-[0_0_0_1px_rgba(0,0,0,0.25)]">
    </div>
  </div>

  <div class="relative mx-auto max-w-7xl px-6 py-24 lg:py-32">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">

      <!-- LEFT CONTENT -->
      <div class="lg:col-span-6 relative z-10">
        

        <!-- HEADLINE (lighter + cleaner rhythm) -->
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-bold uppercase tracking-[-0.01em]">
        <span class="block">Profesionální</span>
        <span class="block mt-2 sm:mt-2">sádrokartonové</span>
        <span class="block mt-2 sm:mt-2">řešení</span>
        </h1>

            <p class="mt-8 max-w-xl
                text-[16px]
                font-normal
                tracking-[0.01em]
                leading-8
                text-[#E5E7EB]/80">
        Profesionální realizace sádrokartonových konstrukcí
        pro rodinné domy,<br>byty i komerční prostory.
        </p>

        <p class="mt-3 max-w-lg
                text-[14px]
                font-light
                tracking-wide
                text-[#E5E7EB]/60">
        Důraz na detail, čistotu práce a dlouhodobou kvalitu.
        </p>



        <!-- CTA (blue from palette) -->
       <div class="mt-10">
  <a
    href="#poptavka"
    class="group inline-flex items-center justify-center gap-2
           rounded-full px-9 py-3
           text-[13px] font-semibold uppercase tracking-[0.18em]
           text-white
           bg-white/5 backdrop-blur
           border border-white/15
           hover:border-[#7C1D2D]/60
           hover:bg-white/10
           transition-all duration-300
           shadow-[0_20px_50px_rgba(0,0,0,0.35)]"
  >
    <span>Nezávazná poptávka</span>
    <span class="h-1.5 w-1.5 rounded-full bg-[#7C1D2D]
                 opacity-70 group-hover:opacity-100 transition"></span>
  </a>
</div>

      </div>

      <!-- RIGHT IMAGE -->
      <div class="lg:col-span-6 relative z-10 flex justify-center lg:justify-end">
        <div
          class="relative overflow-hidden
                 rounded-[28px]
                 shadow-[0_40px_120px_rgba(0,0,0,0.6)]
                 ring-1 ring-white/10"
        >
          <img
            src="assets/home.jpg"
            alt="Sádrokartonové práce Noverito"
            class="h-[420px] w-[360px] object-cover
                   sm:h-[520px] sm:w-[420px]
                   lg:h-[600px] lg:w-[460px]
                   brightness-110 contrast-105 saturate-105"
          />

          <!-- image overlay (lighter + cleaner, no heavy dark cut) -->
          <div class="absolute inset-0 bg-gradient-to-l from-black/0 via-black/10 to-black/20"></div>

          <!-- subtle top highlight like premium photo -->
          <div class="pointer-events-none absolute inset-0 bg-[linear-gradient(to_bottom,rgba(255,255,255,0.08),transparent_30%)]"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- subtle background texture -->
  <div
    class="pointer-events-none absolute inset-0
           bg-[radial-gradient(circle_at_20%_20%,rgba(255,255,255,0.05),transparent_45%)]">
  </div>
</section>
